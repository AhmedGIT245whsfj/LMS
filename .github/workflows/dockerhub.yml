name: Build and Push (Docker Hub)

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: itverse-web
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: itverse-eks
  K8S_NAMESPACE: itverse
  K8S_DEPLOYMENT: itverse-web
  K8S_CONTAINER: web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        if: github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        if: github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Deploy to EKS using sha image tag
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${IMAGE_REPO}:sha-${SHORT_SHA}"

          echo "Deploying image: ${IMAGE}"

          kubectl -n "${K8S_NAMESPACE}" set image "deployment/${K8S_DEPLOYMENT}" \
            "${K8S_CONTAINER}=${IMAGE}"

          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${K8S_DEPLOYMENT}" --timeout=300s

          echo "Current deployment image:"
          kubectl -n "${K8S_NAMESPACE}" get deployment "${K8S_DEPLOYMENT}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
