services:
  web:
    volumes:
      - ./ELearning:/var/www/html

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: itverse-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: itverse
      PMA_PASSWORD: itverse123
    ports:
      - "8091:80"
    depends_on:
      db:
        condition: service_healthy
