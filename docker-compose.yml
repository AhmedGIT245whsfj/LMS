services:
  db:
    image: mariadb:11
    container_name: itverse-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lms_db
      MARIADB_USER: itverse
      MARIADB_PASSWORD: itverse123
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -proot >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: itverse-web
    ports:
      - "8090:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lms_db
      DB_USER: itverse
      DB_PASS: itverse123
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
